name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.0

      - name: Check release version
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync, readFileSync } from 'node:fs';

          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert(
            [version, `v${version}`].includes(process.env.RELEASE_TAG),
            `Release tag must match package.json version ${version} (optionally prefixed with v).`,
          );
          const prerelease = version.split('+')[0].includes('-');
          assert.equal(
            process.env.RELEASE_PRERELEASE,
            String(prerelease),
            'The GitHub prerelease flag must match the package version prerelease suffix.',
          );
          appendFileSync(process.env.GITHUB_OUTPUT, `dist-tag=${prerelease ? 'next' : 'latest'}\n`);
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check library and package
        run: pnpm check
      - name: Check serial maintenance utility
        run: python3 scripts/test-stu-serial-to-hid.py
      - name: Pack release
        run: pnpm pack --out "$RUNNER_TEMP/stusign.tgz"

      - name: Install npm with trusted publishing support
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.21.0 --ignore-scripts
      - name: Publish with npm trusted publishing
        working-directory: ${{ runner.temp }}
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.dist-tag }}
        run: npm publish "$RUNNER_TEMP/stusign.tgz" --access public --provenance --tag "$NPM_DIST_TAG"
